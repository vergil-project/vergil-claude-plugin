name: Ops

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  github-config:
    uses: vergil-project/vergil-actions/.github/workflows/ops-github-config.yml@v2.1
    permissions:
      contents: read
      issues: write
    # `inherit` is required: the automation App keys live in the
    # `automation` environment, and environment secrets reach a cross-repo
    # reusable workflow only under `secrets: inherit`. Allowed only for the
    # App-key workflows (vrg-validate's secrets-inherit check).
    secrets: inherit

  agent-audit:
    # The daily audit of agent merges (epic vergil-project/.github#1384).
    # `hoshin` reads it by this job name. It waits for the config job but
    # still runs when that job fails (`!cancelled()`).
    needs: github-config
    if: ${{ !cancelled() }}
    uses: vergil-project/vergil-actions/.github/workflows/ops-agent-audit.yml@v2.1
    permissions:
      contents: read
    # `inherit` is required: the automation App keys live in the
    # `automation` environment, and environment secrets reach a cross-repo
    # reusable workflow only under `secrets: inherit`. Allowed only for the
    # App-key workflows (vrg-validate's secrets-inherit check).
    secrets: inherit
