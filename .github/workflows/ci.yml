# https://github.com/vergil-project/vergil-actions/blob/develop/.github/workflows/README.md
name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      run-security:
        type: boolean
        default: true
      run-release:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: vergil-project/vergil-actions/.github/workflows/ci-docs.yml@v2.1

  quality:
    uses: vergil-project/vergil-actions/.github/workflows/ci-quality.yml@v2.1
    with:
      language: claude-plugin
      versions: '["latest"]'
      container-suffix: base
      container-tag: 'latest'

  security:
    uses: vergil-project/vergil-actions/.github/workflows/ci-security.yml@v2.1
    with:
      language: claude-plugin
      run-codeql: false
      run-standards: ${{ inputs.run-release != 'false' }}
      run-security: ${{ inputs.run-security != 'false' }}
      container-suffix: base
      container-tag: 'latest'
    permissions:
      contents: read
      security-events: write
      # Requested by ci-security.yml@v2.1.3: codeql-action/upload-sarif
      # needs it on private repos. See vergil-project/vergil-actions#698.
      actions: read

  version:
    uses: vergil-project/vergil-actions/.github/workflows/ci-version-bump.yml@v2.1
    with:
      language: claude-plugin
      run-release: ${{ inputs.run-release != 'false' }}
      container-suffix: base
      container-tag: 'latest'
