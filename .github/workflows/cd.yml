# https://github.com/vergil-project/vergil-actions/blob/develop/.github/workflows/README.md
name: CD

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  # Needed because the release job calls cd-release.yml@v2.1, whose CI-evidence
  # harvest downloads the release PR's artifacts; a reusable workflow cannot
  # request more permission than its caller grants.
  actions: read
  attestations: write
  contents: write
  id-token: write
  pull-requests: write

jobs:
  docs:
    uses: vergil-project/vergil-actions/.github/workflows/cd-docs.yml@v2.1
    permissions:
      contents: write
    # The shared workflow reports a failed publish to the operations queue
    # with the automation App's token, so it needs the App's credentials.
    # `inherit` is required: the automation App keys live in the
    # `automation` environment, and environment secrets reach a cross-repo
    # reusable workflow only under `secrets: inherit`. Allowed only for the
    # App-key workflows (vrg-validate's secrets-inherit check).
    secrets: inherit

  release:
    if: github.ref == 'refs/heads/main'
    uses: vergil-project/vergil-actions/.github/workflows/cd-release.yml@v2.1
    # The release pushes its tag with the automation App's token, so the
    # shared workflow needs the App's credentials.
    # `inherit` is required: the automation App keys live in the
    # `automation` environment, and environment secrets reach a cross-repo
    # reusable workflow only under `secrets: inherit`. Allowed only for the
    # App-key workflows (vrg-validate's secrets-inherit check).
    secrets: inherit
