[project]
repository-type = "library"
versioning-scheme = "semver"
branching-model = "library-release"
release-model = "tagged-release"

[publish]
consumer-refresh = """\
# Refresh the host's plugins: re-add each declared marketplace at its declared ref,
# update every install, and verify the registered repo and ref
vrg-host plugins
# Refresh the plugins in every running dev VM
vrg-vm update --all
# The next Claude Code session start loads the updated plugin, so no
# in-session reload step is needed.
"""

[ci]
versions = ["latest"]
integration-tests = false

[dependencies]
vergil = "v2.1"
